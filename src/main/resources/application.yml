# Every setting can come from the environment: an env-file passed to `docker run --env-file` is the only
# configuration input. DATABASE_URL, HOST and PORT are mapped here; INSPECTION_REQUIRED_FOR and
# STALL_AFTER_MINUTES bind to inspection-required-for and stall-after-minutes through Spring's relaxed binding.
spring:
  datasource:
    url: ${DATABASE_URL:jdbc:h2:file:./target/roomready}
  sql:
    init:
      mode: always

server:
  address: ${HOST:127.0.0.1}
  port: ${PORT:8080}

roomready:
  seed-dir: seed
  inspection-required-for: ${INSPECTION_REQUIRED_FOR:Standard,Deluxe,Suite}
  stall-after-minutes: 30